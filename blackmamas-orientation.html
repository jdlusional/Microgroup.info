  <p class="or-lede">The rest of this orientation, what the public record says about Black Mamas Village and what it is eligible for right now, is created but deliberately not yet filled in. What is written below is the method behind both tools, stated once here rather than repeated inside each product.</p>

  <div class="or-method">
    <span class="or-method-kicker">Method</span>
    <h2>How Almanac was built</h2>
    <h3>Where this comes from</h3>
    <p>Every funder and every grant on the Almanac page is drawn from that funder's own public record: its IRS Form 990 filings, its published guidelines, and its own grant pages. Each match carries a link back to the source it came from, so nothing has to be taken on trust. Where a funder does not publish a figure, an award range, a deadline, an eligibility rule, that gap is marked as unconfirmed rather than filled in.</p>
    <h3>What Almanac will not do</h3>
    <p>It does not invent a fact about a funder. An unpublished deadline is reported as unpublished, not replaced with a plausible-looking date, because a made-up deadline is worse than a missing one: a missing deadline gets checked, and an invented one gets relied on. It also keeps a hard line between a funder that has actually given to this organization before and a funder that merely looks like a good fit. A candidate is never dressed up as a confirmed prior funder.</p>
    <h3>What it cannot tell you</h3>
    <p>Form 990 filings reach the public a year or more after the fact, so a funder's priorities may already have moved. A foundation that funds this kind of work is not therefore open to you: many accept no unsolicited proposals at all, and some of the best matches will be closed doors for reasons no filing records. The ranking is a judgment about fit, not a prediction of success. Treat every row as a lead to verify against the funder's own page before you spend real time on it.</p>
    <h3>How candidates are found and ranked</h3>
    <p>Confirmed funders are institutional grants independently verified against Black Mamas Village's exact legal name and EIN on the funder's own page, not just a name-pattern match; this matters because at least two other Austin nonprofits use very similar "Black Mamas" names. The "Likely, verify" tier is reserved for a funding relationship a research pass surfaces as specific but not independently confirmed, for example a grants-database record under the organization's exact legal name that the organization itself has not confirmed. None of the funders researched here fit that description, so the tier is currently empty rather than padded with a guess.</p>
    <p>The candidate prospects are real, live funders with a documented interest in at least one of Black Mamas Village's three pillars, researched directly on each funder's own current site, with no funding relationship yet. Funders found to be a poor match, invitation-only, geographically excluded, or budget-gated well above Black Mamas Village's size were dropped rather than included to pad the list.</p>
  </div>

  <div class="or-method">
    <span class="or-method-kicker">Method</span>
    <h2>How Scribe was built</h2>
    <h3>Where this comes from</h3>
    <p>Each draft is built from two sources and no others: the Almanac match that identified the funder, with that funder's own published requirements, and the organization's own public record, its website, its filings, and the materials it has already put into the world. Every substantive claim in a draft traces back to one of those two places.</p>
    <h3>What Scribe will not do</h3>
    <p>It does not invent facts about the organization. When an application asks for something only the applicant holds, a budget line, an outcome figure, a board resolution, a letter of support, Scribe does not guess at it. It leaves the space empty and puts the item on the list of what is still needed. This is the whole discipline of the tool: an invented number is worse than a blank one, because a blank gets filled in before it is filed and an invention gets submitted.</p>
    <h3>What it cannot tell you</h3>
    <p>A draft is a draft, not a submission. Funder requirements change, portals impose their own formats and character limits, and the published guidance a draft was built from can already be out of date. Everything has to be checked against the funder's live application before it is filed, and the organization's own people are the only ones who can confirm that what it says about them is true today. Scribe is built to remove the blank page. It is not built to remove the review.</p>
    <h3>How drafts are ranked</h3>
    <p>Payoff is assessed manually, not by an automated scoring pipeline, across Black Mamas Village's Almanac funder matches and a deadline calendar researched directly on each funder's own current site, weighing relevance, award size, urgency, and realistic fit given the organization's current stage. Draft sections are adapted per grant, and Black Mamas Village-specific facts are sourced from the organization's own site and ProPublica Nonprofit Explorer, flagged [CONFIRM] or [MISSING] wherever they are not independently confirmed.</p>
    <p>The research dates are carried on the Scribe half of the enterprise page rather than restated here, because they move with each cycle and this page would go stale.</p>
  </div>

  <div class="or-placeholder">
    <span class="kicker">Not yet built</span>
